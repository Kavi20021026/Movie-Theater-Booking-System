<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Popcorn Place - Register</title>
   
   <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
   <!-- Custom CSS -->
   <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
<div class="form-container">
   <form action="" method="post" enctype="multipart/form-data" onsubmit="showRegisterMessage(); return false;">
      <h3>Register Now</h3>
      <input type="text" name="name" placeholder="Enter username" class="box" required>
      <input type="email" name="email" placeholder="Enter email" class="box" required>
      <input type="password" name="password" placeholder="Enter password" class="box" required>
      <input type="password" name="cpassword" placeholder="Confirm password" class="box" required>
      <div style="text-align: left; margin: 10px 0 5px 5px; font-size: 13px; color: #888;">Upload Profile Image (Optional)</div>
      <input type="file" name="image" class="box" accept="image/jpg, image/jpeg, image/png">
      <input type="submit" name="submit" value="Register Now" class="btn">
      <p>Already have an account? <a href="login.html">Login now</a></p>
   </form>
</div>

<!-- Custom Success Modal Overlay -->
<div class="modal-overlay" id="booking-success-modal">
    <div class="modal-card">
        <div class="modal-icon">
            <i class="bi bi-check2-circle"></i>
        </div>
        <h2>Registration Successful!</h2>
        <p>Your account has been created. Redirecting to login page...</p>
    </div>
</div>

<script>
   function showRegisterMessage() {
      // Render success animation
      const modal = document.getElementById('booking-success-modal');
      modal.classList.add('active');
      
      // Redirect after animation completes
      setTimeout(() => {
         window.location.href = "login.html";
      }, 1500);
   }
</script>

</body>
</html>
