<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Popcorn Place - Login</title>
   
   <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
   <!-- Custom CSS -->
   <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
<div class="form-container">
   <form action="" method="post" enctype="multipart/form-data" onsubmit="showLoginMessage(); return false;">
      <h3>Login Now</h3>
      <input type="email" name="email" placeholder="Enter email" class="box" required>
      <input type="password" name="password" placeholder="Enter password" class="box" required>
      <input type="submit" name="submit" value="Login" class="btn">
      <p>Don't have an account? <a href="register.html">Register now</a></p>
   </form>
</div>

<!-- Custom Success Modal Overlay -->
<div class="modal-overlay" id="booking-success-modal">
    <div class="modal-card">
        <div class="modal-icon">
            <i class="bi bi-check2-circle"></i>
        </div>
        <h2>Login Successful!</h2>
        <p>Welcome back to Popcorn Place. Redirecting to your dashboard...</p>
    </div>
</div>

<script>
   function showLoginMessage() {
      // Set session variables
      localStorage.setItem('loggedIn', 'true');
      
      // Render success animation
      const modal = document.getElementById('booking-success-modal');
      modal.classList.add('active');
      
      // Redirect after animation completes
      setTimeout(() => {
         window.location.href = "after_loging_home/booknow.html";
      }, 1500);
   }
</script>

</body>
</html>
